name: RELEASE Admin

on:
  push:
    branches: [ "stage" ]
    tags:
      - 'v3*'

permissions:
  contents: read
  packages: write

jobs:

# ------- START ADMIN VALIDATION -------- #

  ValidateAdmin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Create environment and install dependencies
        run: |
          python -m venv env
          source env/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          source env/bin/activate
          python -m py_compile src/run.py
          find src/app -name "*.py" -exec python -m py_compile {} \;

      - name: Check for critical files
        run: |
          test -f src/run.py || (echo "Missing run.py" && exit 1)
          test -f requirements.txt || (echo "Missing requirements.txt" && exit 1)
          test -f src/config.py || (echo "Missing config.py" && exit 1)
          echo "✓ All critical files present"

# ------- END ADMIN VALIDATION -------- #

# ------- START MERGE PROCESS -------- #

  MergeMainAdmin:
    needs: [ValidateAdmin]
    name: Merge Stage with Main
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Merge stage -> main
        uses: devmasx/merge-branch@master
        with:
          type: now
          head_to_merge: ${{ github.ref }}
          target_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}

# ------- END MERGE PROCESS -------- #

# ------- START RELEASE PROCESS -------- #

  PostRelease:
    needs: MergeMainAdmin
    name: Create Release
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      release_tag: ${{ steps.taggerDryRun.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Zip artifact for deployment
        run: |
          zip releaseAdmin.zip ./src/* -r
          zip -r releaseAdmin.zip requirements.txt update_translations.sh Jenkinsfile

      - name: Upload Admin artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: Admin
          path: releaseAdmin.zip

      - name: Generate Tagname for release
        id: taggerDryRun
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DRY_RUN: true
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: stage,main
          BRANCH_HISTORY: last
          CUSTOM_TAG_PREFIX: v3

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.taggerDryRun.outputs.new_tag }}
          release_name: Release ${{ steps.taggerDryRun.outputs.new_tag }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

      - name: Upload Release Asset Admin
        id: upload-admin-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./releaseAdmin.zip
          asset_name: releaseAdmin.zip
          asset_content_type: application/zip

# ------- END RELEASE PROCESS -------- #

# ------- START DOCKER PUBLISH TO GHCR -------- #

  PublishDocker:
    needs: PostRelease
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        run: |
          TAG="${{ needs.PostRelease.outputs.release_tag }}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tags=ghcr.io/${REPO}:latest,ghcr.io/${REPO}:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ------- END DOCKER PUBLISH TO GHCR -------- #